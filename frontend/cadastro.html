<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estoque - Criar conta</title>
    <link rel="icon" type="image/png" href="img/aponti-simbolo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-pagina">
    <!-- TOPO -->
    <header class="topo">
      <div class="container py-4">
        <span class="topo-marca">Estoque</span>
      </div>
    </header>

    <main class="auth-principal">
      <section class="auth-cartao" aria-labelledby="tituloCadastro">
        <h1 class="auth-titulo h4 mb-1" id="tituloCadastro">Criar conta</h1>
        <p class="text-muted small mb-4">
          Preencha os dados abaixo para começar a usar o sistema.
        </p>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="formCadastro" novalidate>
          <div class="mb-3 campo-wrapper">
            <label for="cNome" class="form-label">Nome</label>
            <input
              type="text"
              class="form-control"
              id="cNome"
              autocomplete="name"
              required
              minlength="1"
            />
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3 campo-wrapper">
            <label for="cEmail" class="form-label">E-mail</label>
            <input
              type="email"
              class="form-control"
              id="cEmail"
              autocomplete="email"
              required
              pattern="[A-Za-z0-9_%+\-]+(?:\.[A-Za-z0-9_%+\-]+)*@[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z]{2,}"
            />
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3 campo-wrapper">
            <label for="cSenha" class="form-label">Senha</label>
            <input
              type="password"
              class="form-control"
              id="cSenha"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="72"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,72}"
            />
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3 campo-wrapper">
            <label for="cConfirmaSenha" class="form-label"
              >Confirmar senha</label
            >
            <input
              type="password"
              class="form-control"
              id="cConfirmaSenha"
              autocomplete="new-password"
              required
            />
            <div class="invalid-feedback"></div>
          </div>

          <p id="erroCadastro" class="alert alert-danger small mb-3 d-none">
            Preencha todos os campos com valores válidos.
          </p>

          <button type="submit" class="btn btn-primary w-100">
            Criar conta
          </button>
        </form>

        <p class="text-center small mt-4 mb-0">
          Já tem uma conta?
          <a href="index.html" class="auth-link">Entrar</a>
        </p>
      </section>
    </main>

    <!-- CONTAINER DE TOASTS -->
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      id="toastContainer"
    ></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/toast.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>
